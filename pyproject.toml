[project]
name = "transitlens"
version = "0.1.0"
description = "Visual Task Factory: generates transit-map reasoning tasks with independently verified answers, then measures how multimodal models do on them."
requires-python = ">=3.11"
dependencies = ["Pillow>=10", "lxml>=5", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
transitlens = "transitlens.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
